name: training_companion
description: "App degli iscritti di Training Companion"
publish_to: 'none'

# 🚨 **La versione è vera, dal 21/08/2026** — FASE 10.1.
#
# Fino a oggi era `1.0.0+1` e non l'aveva mai toccata nessuno: **ogni APK mai
# costruito si dichiarava «1.0.0» con `versionCode` 1**.
#
# ⚠️ Due guai, e il secondo è immediato:
#   1. il cancello della versione (FASE 10) confronta numeri che erano tutti
#      uguali, quindi non poteva funzionare;
#   2. il Play Store **rifiuta** un caricamento con un `versionCode` già usato.
#      Alla prima pubblicazione passa; alla seconda no.
#
# 💡 Il numero dopo il `+` non si sceglie a mano: è `major*10000 +
# minor*100 + patch`. Così cresce da solo insieme alla versione, e non può
# succedere che due versioni diverse abbiano lo stesso `versionCode` — che è
# l'errore che il Play Store non perdona.
#
# ⚠️ Lo controlla `strumenti/costruisci-apk.ps1`: una versione ferma a `1.0.0`
# o un `versionCode` che non torna **fermano la build**.
version: 9.20.0+92000

environment:
  sdk: ^3.12.2

# ---------------------------------------------------------------------------
# Dipendenze — A0.5
#
# 🚨 ADR-A05: ogni pacchetto ha una motivazione scritta qui. Una dipendenza
# senza motivazione è una dipendenza che nessuno saprà se togliere fra un anno,
# e in un'app mobile ogni pacchetto è peso nel bundle e superficie di
# incompatibilità al prossimo aggiornamento di Flutter.
#
# I vincoli sono `^`, cioè compatibili: pinnare al patch renderebbe impossibile
# ricevere le correzioni di sicurezza senza un intervento manuale.
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # Date, mesi e testi dei widget di serie in italiano. Senza, il calendario
  # resta in inglese e `DateFormat(…, 'it')` lancia a runtime.
  flutter_localizations:
    sdk: flutter

  # ── Rete ────────────────────────────────────────────────────────────────
  # `dio` e non `http`: servono gli **interceptor**. Il token va aggiunto a
  # ogni richiesta e il 401 va intercettato in un punto solo — con `http` quella
  # logica finirebbe copiata in ogni chiamata, e basta dimenticarla una volta
  # per avere una schermata che non si accorge della sessione scaduta.
  dio: ^5.7.0

  # ── Stato e iniezione ───────────────────────────────────────────────────
  # Riverpod: niente `BuildContext` per leggere lo stato (quindi testabile
  # senza widget), invalidazione esplicita delle cache, e i provider fanno
  # anche da contenitore di dipendenze — un pacchetto invece di due.
  flutter_riverpod: ^2.6.1

  # ── Navigazione ─────────────────────────────────────────────────────────
  # `go_router` per i **deep link d'invito** (A2.1): una palestra manda un link
  # e l'app si apre già sul codice giusto. Con il Navigator di serie quel caso
  # va scritto a mano.
  go_router: ^14.6.2

  # ── Persistenza ─────────────────────────────────────────────────────────
  # Il token di Sanctum sta nel Keychain/Keystore, non in un file: è una
  # credenziale a lunga vita, e su un telefono con root un file di preferenze
  # si legge.
  flutter_secure_storage: ^9.2.2

  # Tutto il resto — branding, ultima giornata sfogliata — sta qui: serve
  # perché l'app si apra **a caldo** senza schermata bianca in attesa della
  # rete (A2.5).
  shared_preferences: ^2.3.3

  # ── Media ───────────────────────────────────────────────────────────────
  # Foto dei pasti e dei progressi.
  image_picker: ^1.1.2

  # 🚨 Comprimere PRIMA dell'upload non è un'ottimizzazione: una foto da
  # fotocamera moderna sono 8-12 MB, e su rete mobile l'upload fallisce o
  # impiega mezzo minuto. Il backend ridimensiona comunque a 1568 px per l'AI,
  # quindi mandare l'originale è banda sprecata due volte.
  flutter_image_compress: ^2.3.0

  # Serve alla compressione: la cartella temporanea in cui scrivere il file
  # ridotto. Arriva già come dipendenza transitiva, ma importarla senza
  # dichiararla è il modo per ritrovarsi rotti quando quella transitiva sparisce.
  path_provider: ^2.1.5

  # La galleria dei progressi scorre decine di immagini remote: senza cache su
  # disco ogni scroll le riscarica.
  cached_network_image: ^3.4.1

  # ── Presentazione ───────────────────────────────────────────────────────
  # Grafici di peso e calorie (A6.2, A6.5).
  fl_chart: ^0.69.2

  # Date e numeri in italiano. `intl` è anche ciò che permette di non scrivere
  # a mano «10/08/2026»: i formati cambiano con la lingua del telefono.
  # ⚠️ La versione la impone `flutter_localizations`, che la pinna: un vincolo
  # piu' basso qui fa fallire la risoluzione.
  intl: ^0.20.2

  # ── Realtime ────────────────────────────────────────────────────────────
  # Client Pusher-compatibile per Reverb (A7.4).
  # ⚠️ Il fallback di polling resta OBBLIGATORIO (ADR-A04): su staging non c'è
  # nessun processo Reverb, e su rete mobile il socket spesso non si apre.
  web_socket_channel: ^3.0.1

  # ── Il player di allenamento (C9) ───────────────────────────────────────
  # Lo schermo non deve spegnersi mentre si è sotto un bilanciere: sbloccare il
  # telefono con le mani sudate fra una serie e l'altra è il modo più rapido per
  # far smettere di usare il player.
  wakelock_plus: ^1.2.8

  # 🚨 Il timer di riposo va PROGRAMMATO come notifica, non tenuto con un
  # `Timer`: su iOS il codice Dart in background non gira, e il riposo finirebbe
  # senza avvisare proprio quando il telefono è in tasca. Su Android un `Timer`
  # sopravvive più a lungo ma non è garantito.
  flutter_local_notifications: ^18.0.1

  # Serve a `flutter_local_notifications` per programmare a un istante preciso
  # nel fuso locale.
  timezone: ^0.10.0

  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  health: ^13.3.1
  sodium: 3.2.0
  sodium_libs: 3.2.0

  # 🚨 L'identificativo IANA del telefono (`Europe/Rome`), che Dart da solo NON
  # sa dare: `DateTime.now().timeZoneName` restituisce l'abbreviazione — `CEST`,
  # o su certi Android `GMT+02:00` — che non è un fuso ma un offset, e da un
  # offset non si risale alla regola di ora legale.
  #
  # Serve a due cose: dire al server dove comincia «oggi» per questa persona
  # (A3), e far funzionare davvero `tz.setLocalLocation()`, che con
  # l'abbreviazione lanciava e ricadeva in silenzio su UTC.
  flutter_timezone: ^5.1.0

  # 🚨 L'impronta NON è un secondo fattore — A1.
  #
  # È una scorciatoia per **riaprire una sessione che esiste già**: il token di
  # Sanctum resta nel Keychain e l'impronta ne sblocca l'uso, non lo ottiene dal
  # server. Trattarla come un accesso porterebbe a conservare la password sul
  # telefono, che è esattamente ciò che non si deve fare.
  #
  # ⚠️ Serve solo a **disegnare la richiesta**: la verifica avviene nel chip
  # sicuro del telefono, e nessun dato biometrico passa mai da Dart.
  local_auth: ^3.0.2
  share_plus: ^12.0.2
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  http: ^1.6.0
  image: ^4.8.0
  camera: ^0.12.0+2
  file_picker: 10.0.0
  open_filex: ^4.7.0
  workmanager: ^0.10.9
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Test del client API senza toccare la rete — stessa regola del backend:
  # nessun test tocca la rete.
  http_mock_adapter: ^0.6.1

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  # ── 🧍 Le figure del corpo — 3b-B.1, 24/08/2026 ──────────────────────────
  #
  # 🚨 Quattro file e non due: **davanti e dietro sono immagini separate**. Nel
  #    sorgente stavano affiancate, ma una card ne mostra una alla volta e
  #    ritagliare a runtime vorrebbe dire caricare il doppio dei pixel ogni
  #    volta.
  #
  # ⚠️ Sono **bianche con il fondo trasparente**: la tinta la mette l'app, o su
  #    tema scuro sparirebbero e su tema chiaro sembrerebbero sporche. I
  #    sorgenti stanno in `memory/immagini-sorgente/`, e lo script che li
  #    prepara e' documentato in §72 dell'atlante.
  assets:
    - assets/corpo/
