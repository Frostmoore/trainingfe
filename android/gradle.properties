org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# 🚨 Compilazione incrementale di Kotlin spenta — su Windows.
#
# Con `true` (il default) la build fallisce sistematicamente con
# «Could not close incremental caches in …\caches-jvm\jvm\kotlin:
# class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab»
# su moduli diversi a ogni tentativo, e **non si risolve con `flutter clean`**:
# non è cache vecchia, è Kotlin che non riesce a rilasciare i file `.tab` su
# questo filesystem.
#
# Il costo di spegnerla è quasi nullo qui: i moduli che fallivano sono quelli
# dei **plugin** (`shared_preferences_android`, `flutter_image_compress_common`),
# che si compilano una volta e non cambiano mai — l'incrementale non aveva
# niente da riusare. Il codice nostro è Dart e non passa da Kotlin.
#
# ⚠️ Se un giorno la build torna lenta sul serio, la strada è indagare il
# blocco dei file (antivirus sulla cartella `build/`), non riaccendere questa.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
